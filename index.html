<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>File Explorer</title>
<style>
    body {
        margin: 0;
        background: black;
        color: #00ff00;
        font-family: monospace;
        display: flex;
        height: 100vh;
    }

    #sidebar {
        width: 260px;
        border-right: 1px solid #00ff00;
        padding: 10px;
        overflow-y: auto;
    }

    #content {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        white-space: pre-wrap;
    }

    .dir, .file {
        cursor: pointer;
        user-select: none;
    }

    .dir {
        margin-top: 6px;
    }

    .children {
        margin-left: 16px;
        display: none;
    }

    .open > .children {
        display: block;
    }

    .file:hover, .dir:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div id="sidebar"></div>
<div id="content">Select a file.</div>

<script>
async function loadTree() {
    const res = await fetch("files.json");
    const tree = await res.json();
    const sidebar = document.getElementById("sidebar");
    sidebar.appendChild(renderNodes(tree));
}

function renderNodes(nodes) {
    const container = document.createElement("div");

    nodes.forEach(node => {
        if (node.type === "directory") {
            const dir = document.createElement("div");
            dir.className = "dir";
            dir.textContent = "▸ " + node.name;

            const children = document.createElement("div");
            children.className = "children";
            children.appendChild(renderNodes(node.children));

            dir.onclick = () => {
                dir.parentElement.classList.toggle("open");
                dir.textContent = 
                    (dir.parentElement.classList.contains("open") ? "▾ " : "▸ ")
                    + node.name;
            };

            const wrapper = document.createElement("div");
            wrapper.appendChild(dir);
            wrapper.appendChild(children);
            container.appendChild(wrapper);
        }

        if (node.type === "file") {
            const file = document.createElement("div");
            file.className = "file";
            file.textContent = node.name;
            file.onclick = () => loadFile(node.path);
            container.appendChild(file);
        }
    });

    return container;
}

async function loadFile(path) {
    const res = await fetch(path);
    const text = await res.text();
    document.getElementById("content").textContent = text;
}

loadTree();
</script>

</body>
</html>
