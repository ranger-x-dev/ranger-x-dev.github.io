<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ranger-X</title>
<style>
    body {
        margin: 0;
        background: black;
        color: #00ff00;
        font-family: monospace;
        display: flex;
        height: 100vh;
    }

    #sidebar {
        width: 260px;
        border-right: 1px solid #00ff00;
        padding: 10px;
        overflow-y: auto;
    }

	#main {
		flex: 1;
		display: flex;
		flex-direction: column;
	}

	#titlebar {
		background: #00ff00;
		color: black;
		padding: 6px 10px;
		font-weight: bold;
		border-bottom: 1px solid #00aa00;
	}

	#content {
		flex: 1;
		padding: 15px;
		overflow-y: auto;
		white-space: pre-wrap;
	}


    .dir, .file {
        cursor: pointer;
        user-select: none;
    }

    .dir {
        margin-top: 6px;
    }

    .children {
        margin-left: 16px;
        display: none;
    }

    .open > .children {
        display: block;
    }

    .file:hover, .dir:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div id="sidebar"></div>
<div id="main">
    <div id="titlebar">Loading...</div>
    <div id="content">Loading…</div>
</div>

<script>
async function loadTree() {
    const res = await fetch("files.json");
    const tree = await res.json();
    const sidebar = document.getElementById("sidebar");
    sidebar.appendChild(renderNodes(tree));
    return tree;
}


function renderNodes(nodes) {
    const container = document.createElement("div");

    nodes.forEach(node => {
        if (node.type === "directory") {
            const dir = document.createElement("div");
            dir.className = "dir";
            dir.textContent = "▸ " + node.name;

            const children = document.createElement("div");
            children.className = "children";
            children.appendChild(renderNodes(node.children));

            dir.onclick = () => {
                dir.parentElement.classList.toggle("open");
                dir.textContent = 
                    (dir.parentElement.classList.contains("open") ? "▾ " : "▸ ")
                    + node.name;
            };

            const wrapper = document.createElement("div");
            wrapper.appendChild(dir);
            wrapper.appendChild(children);
            container.appendChild(wrapper);
        }

        if (node.type === "file") {
            const file = document.createElement("div");
            file.className = "file";
            file.textContent = node.name;
            file.onclick = () => {  
				if (node.name.startsWith("^")) {   //If files start with ^ then they will open as a popup
					window.open(node.path, "_blank", "width=900,height=600,resizable=yes,scrollbars=yes");
				} else {
					loadFile(node.path);
				}
			};
            container.appendChild(file);
        }
    });

    return container;
}

async function loadFile(path) {
    const res = await fetch(path);
    const text = await res.text();

    const content = document.getElementById("content");
    const titlebar = document.getElementById("titlebar");

    const filename = path.split("/").pop();
    titlebar.textContent = filename;

    if (path.toLowerCase().endsWith(".html")) {
        content.innerHTML = text;
    } else {
        content.textContent = text;
    }
}


loadTree().then(() => {
    loadFile("README.txt");
});

</script>

</body>
</html>
